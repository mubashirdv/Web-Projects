<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Platform - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Quiz Platform</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="index.html">Categories</a>
          </li>
          <li class="nav-item">
            <a id="loginStatus" class="nav-link" href="login.html">Login/Signup</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section with Search Bar -->
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <h1 class="text-center">Welcome to the Quiz Platform</h1>
        <div class="input-group mb-4">
          <input type="text" class="form-control" placeholder="Search for quizzes..." id="searchBar" />
          <button class="btn btn-primary" id="searchButton" type="button">
            Search
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quiz Categories Section -->
  <div class="container mt-4">
    <h3 class="mb-4">Categories</h3>
    <div class="row" id="quizCategories">
      <!-- Quiz cards will be loaded here dynamically by JavaScript -->
    </div>
  </div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="script.js"></script>
  <script src="quiz.js"></script>
</body>

</html>
